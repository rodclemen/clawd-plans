# Keeps the Status column in README.md in step with what's pushed to clawd-clash and the forks.
# scripts/status.py does the work; this only runs it and commits the README when it changed.
name: Build status

on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours
  workflow_dispatch:          # the "Run workflow" button, for when you've just pushed
  push:
    branches: [main]
    paths: ["**.md", "scripts/status.py"]   # a new or moved plan shows up straight away

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two runs can overlap (a push and a manual run), so each try starts from the latest main and the push
      # is retried if someone else got there first.
      - name: Refresh the README and commit it if anything changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/status.py
            git diff --quiet README.md && exit 0
            git commit -qam "docs(readme): refresh the universes' build status" \
              -m "Worked out by scripts/status.py from the branches, main and release tags on GitHub."
            git push -q origin HEAD:main && exit 0
            echo "push rejected, trying again"
          done
          exit 1
